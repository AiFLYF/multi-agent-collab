name: selftest

# 零依赖纯标准库测试：看板内置断言 + 在临时 git 仓库里的安装器端到端演练。
# 触发：推送到任意分支、针对任意分支的 PR、手工 dispatch。
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.9
          python -m ruff check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Keep the actual 1.7 source for update compatibility tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2e8ba9e29443ff2c80e66ec465f338ac3723b701
          path: .agents/old-kit-1.7
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show versions
        run: |
          python --version
          git --version

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/multi-agent-collab-pycache
        run: python -m compileall -q install.py tools scripts tests

      - name: Board selfcheck
        run: python tools/agents_status.py --selfcheck

      - name: Installation docs and platform catalog
        run: python scripts/sync_install_docs.py --check

      - name: Offline startup context budget
        run: python scripts/measure_context.py --check

      - name: Installer end-to-end tests
        run: python tests/selftest.py

      - name: Session coordination and platform integration
        env:
          MULTI_AGENT_TEST_OLD_KIT: ${{ github.workspace }}/.agents/old-kit-1.7
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Full workflow rehearsal
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: python scripts/rehearse_workflow.py --report .agents/rehearsal-ci.md

      - name: Keep workflow rehearsal evidence
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-rehearsal
          path: .agents/rehearsal-ci.md
          if-no-files-found: ignore
